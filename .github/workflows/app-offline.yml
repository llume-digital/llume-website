name: Lopita · App offline

on:
  push:
    branches: [main]
    paths:
      - "apps/lopita-horarios/offline/**"
      - "apps/lopita-horarios/app/**"
      - "apps/lopita-horarios/lopita_horarios/**"
      - "apps/lopita-horarios/datos/ejemplo.json"
      - "apps/lopita-horarios/herramientas/construir_offline.py"
      - "apps/lopita-horarios/movil/**"
      - "apps/lopita-horarios/tests/test_offline*.py"
      - "apps/lopita-horarios/tests/test_cp_highs.py"
      - "apps/lopita-horarios/requirements*.txt"
      - ".github/workflows/app-offline.yml"
  pull_request:
    paths:
      - "apps/lopita-horarios/offline/**"
      - "apps/lopita-horarios/app/**"
      - "apps/lopita-horarios/lopita_horarios/**"
      - "apps/lopita-horarios/datos/ejemplo.json"
      - "apps/lopita-horarios/herramientas/construir_offline.py"
      - "apps/lopita-horarios/movil/**"
      - "apps/lopita-horarios/tests/test_offline*.py"
      - "apps/lopita-horarios/tests/test_cp_highs.py"
      - "apps/lopita-horarios/requirements*.txt"
      - ".github/workflows/app-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

# El código de la app de horarios vive en apps/lopita-horarios
defaults:
  run:
    working-directory: apps/lopita-horarios

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/lopita-horarios/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Construir la app offline (descarga Pyodide y comprueba los sha256)
        run: python herramientas/construir_offline.py
      - name: Tests del resolutor HiGHS, del puente y recorrido en Chromium sin red
        env:
          LOPITA_OFFLINE_DIST: salida/offline
        run: python -m pytest -q tests/test_cp_highs.py tests/test_offline.py tests/test_offline_navegador.py
      - uses: actions/upload-artifact@v4
        with:
          name: lopita-offline
          path: apps/lopita-horarios/salida/offline
          retention-days: 30

  apk:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lopita-offline
          path: apps/lopita-horarios/movil/www
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lopita-horarios/movil/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Proyecto Android con la app offline dentro
        working-directory: apps/lopita-horarios/movil
        run: |
          npm ci
          npx cap sync android
      - name: Compilar el .apk
        working-directory: apps/lopita-horarios/movil/android
        run: ./gradlew --no-daemon assembleRelease
      - run: mv movil/android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/lopita-horarios-demo.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lopita-horarios-demo-apk
          path: lopita-horarios-demo.apk
          retention-days: 30

  apk-prueba:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lopita-horarios-demo-apk
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Permitir KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y recorrer la app en un emulador de Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sh apps/lopita-horarios/movil/probar_apk.sh lopita-horarios-demo.apk

  # En main, el .apk probado se publica en la release «demo» para descargarlo directamente desde el móvil, sin zip.
  publicar:
    needs: apk-prueba
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .  # este job no hace checkout: solo trae el .apk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lopita-horarios-demo-apk
      - name: Publicar el .apk en la release «demo»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo lopita-horarios-demo.apk --target "$GITHUB_SHA" --prerelease \
            --title "App de demostración para Android" \
            --notes "Descarga lopita-horarios-demo.apk desde el móvil y ábrelo. Usuario admin, contraseña lopita."
