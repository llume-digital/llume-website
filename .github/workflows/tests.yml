name: Lopita · Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/lopita-horarios/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "apps/lopita-horarios/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# El código de la app de horarios vive en apps/lopita-horarios
defaults:
  run:
    working-directory: apps/lopita-horarios

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"  # la misma que la imagen Docker y que Pyodide 314
          cache: pip
          cache-dependency-path: apps/lopita-horarios/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: JavaScript de la interfaz sin variables sin declarar ni restos sin usar (ESLint)
        run: npx -y eslint@10.13.0 .
      - run: python -m pip install -r requirements-dev.txt
      - name: Las versiones fijadas siguen cuadrando con requirements.in
        run: |
          python -m pip install uv
          uv pip compile requirements.in -o /tmp/requirements.txt --python-version 3.14 --quiet
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
      - name: Chromium para el recorrido de la vista diaria
        run: python -m playwright install --with-deps chromium
      # El recorrido en el navegador de la app offline lo hace el workflow «App offline»
      - run: python -m pytest -q --ignore=tests/test_offline_navegador.py

  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen y comprobar que arranca
        run: |
          docker build -t lopita-horarios .
          docker run -d --name lopita -e LOPITA_ADMIN_PASSWORD=prueba-ci-123 -p 8000:8000 lopita-horarios
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          curl -fs http://localhost:8000/healthz
          curl -fs http://localhost:8000/sw.js | grep -q "lopita-"

  imagen-arm:
    # La prueba puede ir en una máquina ARM gratuita de Oracle: la imagen tiene que construir y resolver también ahí
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - name: Construir la imagen para ARM y comprobar que arranca y resuelve
        run: |
          docker build --platform linux/arm64 -t lopita-horarios:arm .
          docker run --rm --platform linux/arm64 lopita-horarios:arm python -c "
          from ortools.sat.python import cp_model
          m = cp_model.CpModel(); x = m.new_int_var(0, 10, 'x'); m.add(x >= 3); m.minimize(x)
          s = cp_model.CpSolver(); assert s.solve(m) == cp_model.OPTIMAL and s.value(x) == 3"
          docker run -d --name lopita --platform linux/arm64 -e LOPITA_ADMIN_PASSWORD=prueba-ci-123 -p 8000:8000 lopita-horarios:arm
          for i in $(seq 1 90); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          curl -fs http://localhost:8000/healthz

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Demo privada (web + app) detrás de Caddy, con contraseña en la web
        run: |
          docker build -t lopita-horarios .
          printf 'basic_auth {\n\tdemo %s\n}\n' "$(docker run --rm caddy:2.10 caddy hash-password --plaintext prueba-ci)" > deploy/demo/acceso-web.caddy
          cat > .env <<'ENV'
          LOPITA_ADMIN_PASSWORD=prueba-ci-123
          LOPITA_SECRET=secreto-solo-para-ci-0123456789abcdef
          LOPITA_DOMINIO=app.localhost
          LOPITA_WEB_DOMINIO=web.localhost
          LOPITA_SEED=vacio
          ENV
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d lopita caddy
          for i in $(seq 1 60); do curl -ksf --resolve app.localhost:443:127.0.0.1 https://app.localhost/healthz && break; sleep 1; done
          web() { curl -ks --resolve web.localhost:443:127.0.0.1 "$@"; }
          test "$(web -o /dev/null -w '%{http_code}' https://web.localhost/)" = 401
          web -u demo:prueba-ci https://web.localhost/catering/ | grep -q "Ponte en contacto"
          web -u demo:prueba-ci -I https://web.localhost/ | grep -qi "x-robots-tag: noindex"
          web -u demo:prueba-ci https://web.localhost/fonts/fonts.css | grep -q Oswald
          web -u demo:prueba-ci -o /dev/null -w '%{http_code}' https://web.localhost/api/web/documentos/carta-comidas | grep -q 404
          curl -ks --resolve app.localhost:443:127.0.0.1 https://app.localhost/ | grep -q 'name="robots"'
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs
      - name: Variante Cloudflare - configuración válida, imagen del túnel y web para Pages
        run: |
          CLOUDFLARE_TUNNEL_TOKEN=prueba docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml config -q
          docker pull "$(grep -o 'cloudflare/cloudflared:[^ ]*' docker-compose.cloudflare.yml)"
          LOPITA_WEB_PRIVADA=1 sh herramientas/construir_web_pages.sh
          test -f salida/web/index.html && test -f salida/web/fonts/fonts.css && grep -q noindex salida/web/_headers
