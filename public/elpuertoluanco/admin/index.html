<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · El Puerto Luanco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<div class="login" id="login">
  <form id="lf">
    <p class="eyebrow">Acceso privado</p>
    <div class="brand">El Puerto</div>
    <p class="mini">Panel de reservas y estadísticas</p>
    <label>Usuario<input id="u" autocomplete="username" required></label>
    <label>Contraseña<input id="p" type="password" autocomplete="current-password" required></label>
    <p id="lerr" class="err" role="alert" hidden>Usuario o contraseña incorrectos.</p>
    <button class="btn primary" style="width:100%">Entrar</button>
    <p class="demo">Versión de demostración con datos de ejemplo.</p>
  </form>
</div>
<div class="adm" id="app" hidden>
  <aside class="side">
    <div class="brand">El Puerto</div>
    <button data-t="panel" class="on">Resumen</button>
    <button data-t="reservas">Reservas</button>
    <button data-t="historico">Histórico</button>
    <button data-t="visitas">Visitas web</button>
    <button class="out" id="out">Salir</button>
  </aside>
  <main class="cont" id="cont"></main>
</div>
<script src="../reservas-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
